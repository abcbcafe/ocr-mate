[package]
name = "ocr-mate"
version = "0.1.0"
edition = "2021"
authors = ["OCR-Mate Contributors"]
description = "Intelligent document OCR tool with split-view editing"
license = "MIT OR Apache-2.0"

[dependencies]
# UI Framework
iced = { version = "0.13", features = ["image", "tokio", "advanced"] }

# Document Processing
pdfium-render = "0.8"
image = { version = "0.25", features = ["png", "jpeg", "tiff", "webp"] }

# Async & HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# File Dialogs
rfd = "0.15"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
directories = "5.0"

[dev-dependencies]
# Testing
mockall = "0.13"
tokio-test = "0.4"
tempfile = "3.14"
wiremock = "0.6"
pretty_assertions = "1.4"
serial_test = "3.2"

# Test fixtures
insta = "1.40"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
